<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15100d">
<meta name="description" content="Knock: a two-card game for up to 10 friends, played with tokens. Pairs beat everything, Aces are high.">
<title>Knock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a one-screen card room. Header strip, an oval felt table in the middle, an action dock pinned to the bottom. */
  --room:#15100d;
  --rail:#3b2016;
  --felt:#0f5248;
  --felt-deep:#08332d;
  --ivory:#f3ead8;
  --brass:#dcab4a;
  --ruby:#c9353f;
  --ink:#1c1714;
  --muted:#b9ab93;
  --font-display:"Limelight", "Didot", Georgia, serif;
  --font-card:"DM Serif Display", Georgia, "Times New Roman", serif;
  --font-body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--room);color:var(--ivory);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.small{font-size:12.5px;line-height:1.45;margin:0}
.muted{color:var(--muted)}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(120% 75% at 50% 45%, #2b1d15 0%, var(--room) 72%)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) max(16px, env(safe-area-inset-right)) 4px max(16px, env(safe-area-inset-left))}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--brass);letter-spacing:.04em}
.brand small{font-size:10.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hright{display:flex;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(243,234,216,.07);border:1px solid rgba(243,234,216,.12);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill .dot{width:7px;height:7px;border-radius:50%;background:#888}
.pill.live .dot{background:#62c48f;box-shadow:0 0 0 3px rgba(98,196,143,.18)}
.pill.warn .dot{background:var(--brass)}
.pill.bad .dot{background:var(--ruby)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(243,234,216,.14);background:rgba(243,234,216,.06);display:grid;place-items:center;padding:0;flex:none}
.iconbtn svg{width:18px;height:18px}

#stage{position:relative;min-height:0;overflow:hidden}
#felt{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 38%, #18695c 0%, var(--felt) 50%, var(--felt-deep) 100%);box-shadow:0 0 0 9px var(--rail),0 0 0 10px #70432a,0 0 0 13px #22120c,0 18px 44px rgba(0,0,0,.7),inset 0 0 56px rgba(0,0,0,.5)}
#felt::after{content:"";position:absolute;inset:12px;border-radius:50%;border:1px solid rgba(220,171,74,.22);pointer-events:none}
#feltPrint{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#feltPrint .p1{font-family:var(--font-display);fill:rgba(243,234,216,.11);letter-spacing:.3em}
#feltPrint .p2{font-family:var(--font-body);font-weight:800;fill:rgba(243,234,216,.09);letter-spacing:.22em}
#center{position:absolute;transform:translate(-50%,-50%);z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;pointer-events:none;width:max-content;max-width:200px}
.phase{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(243,234,216,.66);font-weight:800}
.pot{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-card);font-size:30px;line-height:1;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.34);padding:6px 16px 6px 8px;border-radius:999px}
.pot .lbl{font-family:var(--font-body);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.below{font-size:12.5px;line-height:1.4;color:rgba(243,234,216,.82);text-wrap:balance}
.below b{color:var(--ivory)}
.below em{font-style:normal;color:var(--brass);font-weight:800}
.coin{width:16px;height:16px;border-radius:50%;flex:none;background:radial-gradient(circle, var(--brass) 0 36%, #8a6420 37% 45%, var(--brass) 46% 100%);box-shadow:0 1px 0 #6d4d15, inset 0 0 0 1.5px #f3d28a}
.pot .coin{width:22px;height:22px}

.card{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.13);background:linear-gradient(160deg,#fffaf1,var(--ivory));color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-card);box-shadow:0 1px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.35);position:relative;flex:none;user-select:none}
.card .r{font-size:calc(var(--cw)*.5);line-height:.95;letter-spacing:-.04em}
.card .s{font-size:calc(var(--cw)*.42);line-height:1;margin-top:calc(var(--cw)*.03);font-family:Georgia,"Times New Roman",serif}
.card.red{color:var(--ruby)}
.card.slot{background:transparent;box-shadow:none;border:1.5px dashed rgba(243,234,216,.17)}
.card.back{background:repeating-linear-gradient(45deg,#7b1e27 0 3px,#94303a 3px 6px);border:2px solid #f3ead8}
.card.back::after{content:"";position:absolute;inset:2px;border:1px solid rgba(243,234,216,.35);border-radius:calc(var(--cw)*.08)}
.card.dim{filter:brightness(.55) saturate(.5)}
.card.deal{animation:deal .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{transform:translateY(-22px) rotate(-10deg) scale(.8);opacity:0}to{opacity:1}}

#seats{position:absolute;inset:0;pointer-events:none}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:92px;transition:left .5s ease,top .5s ease;z-index:3}
.minis{--cw:24px;display:flex;gap:1px;height:calc(var(--cw)*1.4);margin-bottom:-11px;position:relative;z-index:0}
.minis .card:nth-child(1){transform:rotate(-7deg)}
.minis .card:nth-child(2){transform:rotate(7deg)}
.seat.mine .minis{--cw:27px}
.plate{position:relative;z-index:1;width:90px;padding:7px 6px 8px;border-radius:12px;background:rgba(17,12,9,.95);border:1px solid rgba(220,171,74,.3);text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.45)}
.nm{font-size:12px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.nm .tag{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);vertical-align:1px}
.stk{font-size:12px;font-weight:800;color:var(--brass);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:3px}
.stk .coin{width:11px;height:11px}
.dchip{position:absolute;top:-9px;left:-9px;width:21px;height:21px;border-radius:50%;background:var(--brass);color:var(--ink);font:800 11px/21px var(--font-body);text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.55),inset 0 0 0 2px #f3d28a;z-index:4}
.stk.neg{color:#f08a91}
.deckinfo{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.tb{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid rgba(220,171,74,.3)}
.tb .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.tbrow{display:flex;flex-wrap:wrap;gap:14px}
.tbp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:700}
.tbp small{font-size:11px;color:var(--muted);font-weight:600}
.tbc{--cw:30px;display:flex;gap:3px}
.firstbtn{position:absolute;top:-9px;right:-9px;min-width:24px;height:21px;padding:0 5px;border-radius:999px;background:var(--ivory);color:var(--ink);font:800 10px/21px var(--font-body);text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.55);z-index:4}
.seat.turn .plate{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass),0 0 24px rgba(220,171,74,.55)}
.seat.fold .minis,.seat.fold .plate,.seat.out .plate,.seat.out .minis{opacity:.45}
.seat.waiting .plate{border-style:dashed}
.seat.away .nm::after{content:" (away)";font-weight:600;color:var(--muted)}
.seat.mine .plate{border-color:rgba(243,234,216,.6)}
.seat.win .plate{background:linear-gradient(180deg,#f2cb6d,var(--brass));color:var(--ink);border-color:#f6dc9a}
.seat.win .stk,.seat.win .nm .tag{color:var(--ink)}
.tbar{position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:2px;background:var(--brass);transform-origin:left;animation:tick linear forwards}
@keyframes tick{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.won{position:absolute;top:-20px;font-weight:800;color:var(--brass);font-size:15px;font-variant-numeric:tabular-nums;animation:float 1.6s ease-out both;text-shadow:0 1px 4px #000;z-index:5}
@keyframes float{from{transform:translateY(10px);opacity:0}25%{opacity:1}to{transform:translateY(-4px);opacity:1}}
.tagpill{margin-top:5px;height:21px;display:inline-flex;align-items:center;font-size:11px;font-weight:800;padding:0 9px;border-radius:999px;background:rgba(6,22,19,.82);color:var(--ivory);white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.tagpill.empty{visibility:hidden}
.tagpill.knock{background:var(--brass);color:var(--ink)}
.tagpill.fold{color:#eba0a5}
.tagpill.pay{background:#5a1b20;color:#ffd9dc}
.tagpill.win{background:var(--ivory);color:var(--ink)}
#seats.compact .seat{width:78px}
#seats.compact .plate{width:76px;padding:6px 4px 7px}
#seats.compact .nm,#seats.compact .stk{font-size:11px}
#seats.compact .minis{--cw:21px}
#seats.compact .seat.mine .minis{--cw:24px}
#seats.compact .tagpill{font-size:10px;padding:0 7px}

.dock{position:relative;z-index:6;background:linear-gradient(180deg,#231914,#17110d);border-top:1px solid rgba(220,171,74,.22);padding:12px max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 12px) max(16px,env(safe-area-inset-left));min-height:calc(env(safe-area-inset-bottom) + 128px)}
.dock-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.me-row{display:flex;align-items:center;gap:14px}
.mycards{--cw:48px;display:flex;gap:6px;flex:none}
.me-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.me-hand{font-weight:800;font-size:16px;line-height:1.25}
.me-sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
.me-sub b{color:var(--brass)}
.status{font-size:13.5px;line-height:1.45;margin:0}
.status em{font-style:normal;color:var(--brass);font-weight:800;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:8px}
.btn{min-height:50px;border-radius:14px;border:0;font-weight:800;font-size:15px;padding:10px 12px;letter-spacing:.01em;transition:transform .08s ease;font-variant-numeric:tabular-nums}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.fold{background:transparent;color:#f1b6ba;border:1.5px solid rgba(201,53,63,.75)}
.btn.knock{background:var(--brass);color:var(--ink);font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:.06em}
.btn.gold{background:var(--brass);color:var(--ink)}
.btn.ghost{background:rgba(243,234,216,.07);color:var(--ivory);border:1px solid rgba(243,234,216,.18)}
.btn.wide{width:100%}
.lead{margin:0;font-size:14px;line-height:1.45}
.joinrow{display:flex;gap:8px;align-items:center}
.joinrow .grow{flex:1;min-width:0}
.joinrow input{flex:1;min-width:0;min-height:50px;border-radius:14px;border:1px solid rgba(243,234,216,.22);background:rgba(0,0,0,.32);padding:0 14px;font-size:16px}
.joinrow input::placeholder{color:rgba(243,234,216,.45)}
#codeIn{text-transform:uppercase;letter-spacing:.14em}
.linkbtn{background:none;border:0;padding:0;color:var(--brass);font-weight:700;text-decoration:underline;text-underline-offset:2px}
.notice{font-size:13px;line-height:1.35;padding:8px 10px;border-radius:12px;background:rgba(220,171,74,.12);border:1px solid rgba(220,171,74,.38);display:flex;gap:10px;align-items:center;justify-content:space-between}
.notice.bad{background:rgba(201,53,63,.12);border-color:rgba(201,53,63,.45)}
.chipbtn{min-height:38px;border-radius:10px;border:1px solid rgba(243,234,216,.2);background:rgba(243,234,216,.07);font-weight:700;font-size:13px;padding:0 12px;white-space:nowrap;flex:none}
.invite{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid rgba(220,171,74,.28)}
.invite .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.invite code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--ivory);overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.divider{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(243,234,216,.14)}

.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.58);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:#1d1511;border:1px solid rgba(220,171,74,.28);border-bottom:0;border-radius:22px 22px 0 0;padding:18px max(18px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 22px) max(18px, env(safe-area-inset-left));display:flex;flex-direction:column;gap:22px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font-family:var(--font-display);font-weight:400;color:var(--brass);font-size:24px;margin:0}
.sheet h3{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:800}
.sheet section{display:flex;flex-direction:column;gap:10px}
.field{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px;font-weight:600}
.field select{min-height:42px;min-width:132px;border-radius:10px;background:#2a201a;border:1px solid rgba(243,234,216,.2);padding:0 10px;font-weight:700}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border-radius:12px;background:rgba(243,234,216,.05);font-size:14px}
.plist .who{font-weight:700;min-width:0;overflow-wrap:anywhere}
.plist .amt{color:var(--brass);font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto}
.plist .asked{font-size:11px;color:var(--brass);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ranks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ranks li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
.ranks li.gap{font-size:12px;color:var(--muted);font-weight:600}
.ranks .ex{--cw:22px;display:flex;gap:2px}
.ranks .ex .card{box-shadow:none}
.howto{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.45;max-width:65ch}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);background:var(--ivory);color:var(--ink);font-weight:800;font-size:14px;padding:8px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:60;animation:toast 2.6s ease both;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}10%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}

@media (min-width:720px){
  .brand b{font-size:30px}
  #seats:not(.compact) .seat{width:104px}
  #seats:not(.compact) .plate{width:102px}
  .nm,.stk{font-size:13px}
  .minis{--cw:28px}
  .seat.mine .minis{--cw:30px}
  #center{max-width:260px}
}
@media (prefers-reduced-motion: reduce){
  .card.deal,.won,.toast{animation-duration:.01ms}
  .seat{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><b>Knock</b><small id="sub">Two cards · pairs win</small></div>
    <div class="hright">
      <span class="pill" id="netpill"><span class="dot"></span><span id="netTxt">Not at a table</span></span>
      <button class="iconbtn" type="button" data-act="menu" aria-label="Open table menu"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
    </div>
  </header>
  <main id="stage" aria-label="Card table">
    <div id="felt"><svg id="feltPrint" aria-hidden="true"></svg></div>
    <div id="center">
      <div class="phase" id="phase">Knock</div>
      <div class="pot" id="pot" hidden></div>
      <div class="deckinfo" id="deckinfo"></div>
      <div class="below" id="below"></div>
    </div>
    <div id="seats"></div>
  </main>
  <footer class="dock" id="dock"><div class="dock-inner" id="dockInner" aria-live="polite"></div></footer>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Table menu"></div></div>

/* ---------- Knock rules engine. Runs on the dealer's phone; amounts are whole cents. ---------- */
const MAX_SEATS = 10;
const RANKS = '23456789TJQKA';
const SUITS = 'shdc';
const RNAME = {2:'Two',3:'Three',4:'Four',5:'Five',6:'Six',7:'Seven',8:'Eight',9:'Nine',10:'Ten',11:'Jack',12:'Queen',13:'King',14:'Ace'};

  const a = new Uint32Array(1); const lim = Math.floor(4294967296 / n) * n;
  do { crypto.getRandomValues(a); } while (a[0] >= lim);
  return a[0] % n;
}
function newDeck(){
  const d = [];
  for (const r of RANKS) for (const s of SUITS) d.push(r + s);
  for (let i = d.length - 1; i > 0; i--) { const j = randInt(i + 1); const t = d[i]; d[i] = d[j]; d[j] = t; }
  return d;

const rv = c => RANKS.indexOf(c[0]) + 2;
const validCard = c => typeof c === 'string' && /^[2-9TJQKA][shdc]$/.test(c);
/* Hand order: any pair beats any non-pair; higher pair wins; otherwise high card, then second card. Suits never count. */
function score2(h){
  const [a, b] = h.map(rv).sort((x, y) => y - x);
  return a === b ? [1, a, 0] : [0, a, b];

    parts.push(`<section><h3>Host controls</h3>
      <div class="field"><label for="setAnte">Ante each hand</label>${sel('setAnte', [[50,'0.50'],[100,'1.00'],[150,'1.50'],[200,'2.00'],[500,'5.00']], cfg.ante)}</div>
      <div class="field"><label for="setStart">Tokens for new players</label>${sel('setStart', [[1000,'10.00'],[2000,'20.00'],[5000,'50.00'],[10000,'100.00']], cfg.st)}</div>
      <div class="field"><label for="setTimer">Time to decide</label>${sel('setTimer', [[0,'No limit'],[20,'20 seconds'],[30,'30 seconds'],[60,'60 seconds']], cfg.tm)}</div>
      <div class="field"><label for="setPause">New hands</label>${sel('setPause', [[0,'Keep dealing'],[1,'Pause']], S.pause)}</div>
      <p class="small muted">Your phone is running this table, so keep this page open with the screen on. Changes start with the next hand.</p>
    </section>
    <section><h3>Players and tokens</h3><ul class="plist">${players || '<li>No one has sat down yet.</li>'}</ul>
      <div class="btnrow"><button type="button" class="btn ghost" data-act="addbot">Add a bot</button><button type="button" class="btn ghost" data-act="rmbots">Remove bots</button></div></section>`);
  } else if (s) {
    const dealer = (s.seats.find(x => x && x.c === s.hid) || {}).n;
    parts.push(`<section><h3>Table settings</h3><p class="small">Ante ${fmtT(cfg.ante)} · New players get ${fmtT(cfg.st)} · ${+cfg.tm ? cfg.tm + ' seconds to decide' : 'No time limit'}.</p><p class="small muted">${dealer ? esc(dealer) + ' is the host and' : 'The host'} can change these and hand out tokens.</p></section>`);
  }
  parts.push(`<section><h3>How to play</h3><ol class="howto">
    <li>When a new pot starts, everyone puts in the ante (${fmtT(cfg.ante)}). Then the dealer gives everyone two cards that only they can see.</li>
    <li>Starting with the player to the dealer's left, each player chooses <b>Knock</b> or <b>Fold</b>. You can see what the players before you chose.</li>
    <li>If you're the only one who knocks, you take the pot, and the next hand starts over with everyone anteing.</li>
    <li>If two or more knock, the best hand takes the pot. Every knocker who loses puts up the whole pot amount, even if it puts them below zero, and that money is the next pot. Nobody antes for that hand, and players who folded play it free.</li>
    <li>If knockers tie for the best hand, only they get two new cards each, and the higher hand wins.</li>
    <li>If nobody knocks, the pot stays, everyone antes again, and new cards are dealt.</li>
    <li>The dealer deals from one shuffled deck until there aren't enough cards left to give everyone two. Then the deck is reshuffled and the player to the dealer's left becomes the dealer.</li>
  </ol></section>`);
  const row = (label, cs) => `<li><span>${label}</span><span class="ex">${cs.match(/../g).map(c => cardHTML(c)).join('')}</span></li>`;
  parts.push(`<section><h3>Best to worst</h3><ul class="ranks">
    ${row('Pair of Aces', 'AsAh')}${row('Pair of Kings', 'KcKd')}<li class="gap">…every pair, down to a Pair of Twos</li>${row('Pair of Twos', '2s2d')}
    ${row('Ace-King', 'AdKs')}${row('Ace-Queen', 'AcQh')}<li class="gap">…Ace with anything, then King-Queen and down</li>${row('King-Queen', 'KhQs')}${row('Three-Two (lowest)', '3c2d')}
  </ul><p class="small muted">Suits never matter. Any pair beats any two different cards.</p></section>`);
  return parts.join('');
}
function renderMenu(s){ if (menuOpen) setHTML($('#sheet'), menuHTML(s)); }
function openMenu(){ menuOpen = true; $('#sheetWrap').hidden = false; renderMenu(cur()); }
function closeMenu(){ menuOpen = false; $('#sheetWrap').hidden = true; }
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2700);
}
function notify(s){
  const i = s ? mySeatIdx(s) : -1;
  const myTurn = !!s && i >= 0 && s.ph === 'deciding' && s.tn === i;
  if (myTurn) {
    const key = s.hand + ':' + s.q;
    if (notifiedTurn !== key) { notifiedTurn = key; if (pendingKey !== key) { toast('Your call: knock or fold'); try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {} } }
  }
  const title = myTurn ? 'Your call · Knock' : 'Knock';
  if (document.title !== title) document.title = title;
  if (s && s.ph === 'done' && s.res) {
    const key = s.code + ':' + s.hand;
    if (notifiedRes !== key) {
      notifiedRes = key;
      const w = (s.res.w || []).find(r => r.i === i), l = (s.res.l || []).find(r => r.i === i);
      if (w) toast(`You won ${fmtT(w.amt)}`); else if (l) toast(`You lost the knock and pay ${fmtT(l.amt)}`);
    }
  }
}
function render(){
  const s = cur();
  renderHeader(s);
  renderSeats(s);
  renderCenter(s);
  setHTML($('#dockInner'), dockHTML(s));
  renderMenu(s);
  notify(s);
}

/* ---------- events ---------- */
function loop(){
  const now = Date.now();
  if (role === 'host') hostTick();
  else if (role === 'player') {
    if (conn && conn.open) {
      if (now - lastPing > 5000) { lastPing = now; send({ t:'ping' }); }
      if (now - lastHostMsg > 20000) { dropConn(); netState = 'lost'; connectClient(); }
    }
    scheduleRender();
  }
}
function bindUI(){
  document.addEventListener('click', e => {
    if (e.target && e.target.id === 'sheetWrap') { closeMenu(); return; }
    const b = e.target.closest && e.target.closest('[data-act]'); if (!b || b.disabled) return;
    switch (b.dataset.act) {
      case 'menu': openMenu(); break;
      case 'menu-close': closeMenu(); break;
      case 'sit': sitDown(); break;
      case 'stand': standUp(); closeMenu(); break;
      case 'knock': act('knock'); break;
      case 'fold': act('fold'); break;
      case 'ask': askTokens(); break;
      case 'give': giveTokens(+b.dataset.i); break;
      case 'addbot': addBot(); break;
      case 'rmbots': removeBots(); break;
      case 'resume-deal': setCfg('pause', 0); break;
      case 'copy': copyLink(); break;
      case 'share': shareLink(); break;
      case 'resume': { const sv = loadSaved(); if (sv) { history.replaceState(null, '', location.pathname + location.search + '#' + sv.code); resumeHost(sv); } break; }
    }
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'codeForm') {
      const v = (f.querySelector('input').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (v.length < 4) { toast('Type the table code your host sent you'); return; }
      const nm = cleanName($('#nameIn') && $('#nameIn').value);
      if (nm) { myName = nm; store.set('knock_name', nm); }
      location.hash = v; return;
    }
    const inp = f.querySelector('input'); const nm = cleanName(inp && inp.value);
    if (!nm) { toast('Type your name first'); if (inp) inp.focus(); return; }
    if (f.id === 'startForm') { myName = nm; store.set('knock_name', nm); startTable(); }
    else if (f.id === 'nameForm') { setName(nm); sitDown(); }
    else if (f.id === 'renameForm') { setName(nm); toast('Name saved'); }
    scheduleRender();
  });
  document.addEventListener('change', e => {
    const t = e.target;
    const map = { setAnte:'ante', setStart:'start', setCap:'cap', setTimer:'timer', setPause:'pause' };
    if (map[t.id]) setCfg(map[t.id], t.value);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && menuOpen) closeMenu(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (role === 'player' && (!conn || !conn.open)) connectClient();
    if (role === 'host') { if (!peer || peer.destroyed) startHosting(); else if (peer.disconnected) { try { peer.reconnect(); } catch (e) { startHosting(); } } keepAwake(); }
  });
  window.addEventListener('hashchange', () => location.reload());
  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe($('#stage'));
}
function boot(){
  bindUI(); layout();
  if (code) {
    const saved = loadSaved();
    if (saved && saved.code === code) resumeHost(saved);
    else { role = 'player'; if (myName) me.sit = true; connectClient(); }
  }
  render();
  setInterval(loop, 500);
}
boot();
})();
</script>
